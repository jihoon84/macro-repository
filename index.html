<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>서울 경매지도</title>
<script>
  window.__kakaoLoadError = false;
</script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c17c55872e7a0aa94a885761d7e3124f&autoload=false"
  onerror="window.__kakaoLoadError=true;"></script>
<style>
  :root{
    --ink:#1c2431; --ink-2:#2c374a; --paper:#f6f3ec; --paper-2:#eee9dd;
    --line:#d9d2c1; --seal:#9c3b34; --seal-soft:#f1ded9; --gold:#a9822f;
    --gold-soft:#efe4c8; --ink-soft:#6b7280;
    --land:#efece2; --land-2:#f6f4ec; --river:#bcd3dd; --road:#ddd6c4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    color:var(--ink);}
  #app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  header{padding:14px 16px 12px;background:var(--ink);color:var(--paper);flex-shrink:0;}
  header .row1{display:flex;align-items:baseline;justify-content:space-between;}
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-0.2px;display:flex;align-items:center;gap:7px;}
  header .count{font-size:12px;color:#c9b98f;font-weight:600;}
  header .sub{font-size:11.5px;color:#9aa3b2;margin-top:3px;}

  .filters{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 12px;background:var(--ink);flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;padding:6px 12px;border-radius:16px;font-size:12.5px;font-weight:600;background:var(--ink-2);color:#cdd3dc;border:1px solid #3a4558;cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}

  .legend{display:flex;gap:10px;align-items:center;padding:7px 16px;background:var(--paper-2);font-size:10px;color:var(--ink-soft);flex-shrink:0;border-bottom:1px solid var(--line);}
  .legend span{display:flex;align-items:center;gap:4px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  #mapWrap{flex:1 1 46%;min-height:250px;position:relative;background:var(--land);overflow:hidden;}
  #map{width:100%;height:100%;}
  #mapStatus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--land);color:var(--ink-soft);font-size:12px;text-align:center;padding:20px;z-index:5;}

  .iw{background:#fff;border-radius:9px;padding:9px 11px;box-shadow:0 8px 20px rgba(0,0,0,.2);
    min-width:150px;max-width:200px;border:1px solid var(--line);}
  .iw .t-name{font-size:12.5px;font-weight:800;color:var(--ink);}
  .iw .t-addr{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}
  .iw .t-price{font-size:11.5px;font-weight:800;color:var(--seal);margin-top:4px;}

  .sheet{flex:1 1 54%;overflow-y:auto;background:var(--paper);border-top:2px solid var(--ink);-webkit-overflow-scrolling:touch;}
  .sheet-inner{padding:12px 14px 28px;}
  .sort-row{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 10px;font-size:12px;color:var(--ink-soft);}
  .sort-row select{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 6px;color:var(--ink);font-weight:600;}

  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:10px;cursor:pointer;}
  .card.selected{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-name{font-size:15px;font-weight:700;color:var(--ink);line-height:1.3;}
  .card-addr{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .badge{flex-shrink:0;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap;}
  .badge.hot{background:var(--seal-soft);color:var(--seal);}
  .badge.warm{background:var(--gold-soft);color:var(--gold);}
  .badge.new{background:#e4e9f0;color:var(--ink-2);}
  .price-row{display:flex;align-items:baseline;gap:8px;margin-top:9px;flex-wrap:wrap;}
  .price-now{font-size:18px;font-weight:800;color:var(--ink);}
  .price-orig{font-size:12px;color:var(--ink-soft);text-decoration:line-through;}
  .meta-row{display:flex;gap:12px;margin-top:8px;font-size:11.5px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:8px;flex-wrap:wrap;}
  .meta-row b{color:var(--ink-2);font-weight:700;}
  .tags{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;}
  .tag{font-size:10.5px;background:var(--paper-2);color:var(--ink-2);padding:2px 7px;border-radius:5px;font-weight:600;}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row1">
      <h1>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9b98f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6M8.5 15.5L4 20M6 12l6 6M16 6l-3 3M18 3l3 3-3 3-3-3z"/></svg>
        서울 경매지도
      </h1>
      <span class="count" id="resultCount">14건</span>
    </div>
    <div class="sub" id="updatedSub">경매마당 · 대법원 법원경매 기준 · 불러오는 중...</div>
  </header>

  <div class="filters" id="guFilters"></div>
  <div class="legend">
    <span><i class="dot" style="background:#9c3b34"></i>35%↑ 고할인</span>
    <span><i class="dot" style="background:#a9822f"></i>20~34%</span>
    <span><i class="dot" style="background:#2c374a"></i>20% 미만</span>
  </div>

  <div id="mapWrap">
    <div id="map"></div>
    <div id="mapStatus">지도를 불러오는 중...</div>
  </div>

  <div class="sheet">
    <div class="sheet-inner">
      <div class="sort-row">
        <span id="listLabel">전체 아파트 경매</span>
        <select id="sortSel">
          <option value="deadline">매각기일 빠른순</option>
          <option value="discount">할인율 높은순</option>
          <option value="priceAsc">최저가 낮은순</option>
          <option value="priceDesc">최저가 높은순</option>
        </select>
      </div>
      <div id="list"></div>
    </div>
  </div>
</div>

<script>
let DATA = [];

function pct(d){ return Math.round((1 - d.minBid/d.appraisal)*100); }
function tier(d){ const p = pct(d); if(p>=35) return "hot"; if(p>=20) return "warm"; return "new"; }
function tierColor(t){ return t==="hot" ? "#9c3b34" : t==="warm" ? "#a9822f" : "#2c374a"; }
function won(v){
  const eok = Math.floor(v/10000), man = v%10000;
  if(eok>0 && man>0) return `${eok}억 ${man.toLocaleString()}만원`;
  if(eok>0) return `${eok}억원`;
  return `${man.toLocaleString()}만원`;
}

let map, markers = {}, overlays = {};

function initMap(){
  const container = document.getElementById('map');
  const center = new kakao.maps.LatLng(37.535, 127.045);
  map = new kakao.maps.Map(container, { center, level: 8 });
  document.getElementById('mapStatus').style.display = 'none';

  DATA.forEach(d=>{
    const t = tier(d);
    const pos = new kakao.maps.LatLng(d.lat, d.lng);
    const content = document.createElement('div');
    content.style.cssText = `width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
      background:${tierColor(t)};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);
      display:flex;align-items:center;justify-content:center;cursor:pointer;`;
    const label = document.createElement('span');
    label.style.cssText = 'transform:rotate(45deg);font-size:9.5px;font-weight:800;color:#fff;';
    label.textContent = pct(d)+'%';
    content.appendChild(label);

    const overlay = new kakao.maps.CustomOverlay({ position: pos, content, yAnchor: 1, xAnchor: 0.5 });
    overlay.setMap(map);
    overlays[d.id] = overlay;

    const iw = new kakao.maps.CustomOverlay({
      position: pos, yAnchor: 1.9,
      content: `<div class="iw">
        <div class="t-name">${d.name}</div>
        <div class="t-addr">${d.gu} ${d.dong} · ${d.area}</div>
        <div class="t-price">최저가 ${won(d.minBid)} · ${pct(d)}%↓</div>
      </div>`
    });
    markers[d.id] = iw;

    content.addEventListener('click', ()=> selectCard(d.id, true));
  });

  kakao.maps.event.addListener(map, 'click', ()=>{
    Object.values(markers).forEach(m=>m.setMap(null));
  });
}

function showTip(d){
  Object.values(markers).forEach(m=>m.setMap(null));
  markers[d.id].setMap(map);
  map.panTo(new kakao.maps.LatLng(d.lat, d.lng));
}

let kakaoReady = false, dataReady = false;

function maybeInitMap(){
  if (kakaoReady && dataReady && !map) {
    try {
      initMap();
    } catch(err) {
      document.getElementById('mapStatus').textContent =
        '지도 초기화 중 오류: ' + (err && err.message ? err.message : err);
    }
  }
}

function tryInitKakaoMap(attemptsLeft){
  if (window.__kakaoLoadError) {
    document.getElementById('mapStatus').textContent =
      '카카오 스크립트 로드 자체가 실패했어요. 네트워크 연결(와이파이/데이터)을 확인하거나, 브라우저를 새로고침(캐시 삭제 후)해보세요.';
    return;
  }
  if (window.kakao && window.kakao.maps && window.kakao.maps.load) {
    window.kakao.maps.load(function(){
      kakaoReady = true;
      maybeInitMap();
    });
    return;
  }
  if (attemptsLeft > 0) {
    setTimeout(function(){ tryInitKakaoMap(attemptsLeft - 1); }, 300);
  } else {
    document.getElementById('mapStatus').textContent =
      '카카오맵 스크립트가 아직 로드되지 않았어요. 도메인이 JavaScript 키에 등록되어 있는지, http(s) 주소로 접속했는지 확인해주세요.';
  }
}
window.addEventListener('error', function(e){
  const el = document.getElementById('mapStatus');
  if (el && el.style.display !== 'none' && !el.dataset.shown) {
    el.dataset.shown = '1';
    el.style.display = 'flex';
    el.textContent = '오류 발생: ' + (e.message || '알 수 없는 오류') + ' (' + (e.filename||'') + ')';
  }
});
window.addEventListener('load', function(){ tryInitKakaoMap(10); });

let activeGu = "전체", sortMode = "deadline", selectedId = null;

function buildFilters(){
  const guList = ["전체", ...Array.from(new Set(DATA.map(d=>d.gu))).sort()];
  const guFiltersEl = document.getElementById('guFilters');
  guFiltersEl.innerHTML = "";
  guList.forEach(gu=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (gu==="전체" ? ' active' : '');
    chip.textContent = gu;
    chip.onclick = ()=>{ activeGu = gu; render();
      [...guFiltersEl.children].forEach(c=>c.classList.toggle('active', c===chip));
    };
    guFiltersEl.appendChild(chip);
  });
}
document.getElementById('sortSel').addEventListener('change', e=>{ sortMode = e.target.value; render(); });
function saleDateToNum(s){ return parseInt((s||"").replace('.',''),10) || 0; }

function formatUpdatedAt(iso){
  if(!iso) return "업데이트 시각 알 수 없음";
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())} 기준 자동 업데이트`;
}

async function loadData(){
  try {
    const res = await fetch('./data.json', {cache:'no-store'});
    if(!res.ok) throw new Error('data.json 응답 오류: ' + res.status);
    const json = await res.json();
    DATA = json.items || [];
    document.getElementById('updatedSub').textContent =
      `경매마당 · 대법원 법원경매 기준 · ${formatUpdatedAt(json.updatedAt)}`;
  } catch(err) {
    document.getElementById('updatedSub').textContent =
      '데이터를 불러오지 못했어요 (' + err.message + ')';
    document.getElementById('list').innerHTML =
      '<div class="empty">데이터 로드 실패. data.json 파일이 같은 폴더에 있는지 확인해주세요.</div>';
  }
  dataReady = true;
  buildFilters();
  render();
  maybeInitMap();
}

function updatePinDimming(){
  const visibleIds = new Set(DATA.filter(d=> activeGu==="전체" || d.gu===activeGu).map(d=>d.id));
  DATA.forEach(d=>{
    const ov = overlays[d.id];
    if(!ov) return;
    const content = ov.getContent();
    if(typeof content !== 'string' && content.style){
      content.style.opacity = visibleIds.has(d.id) ? '1' : '0.28';
    }
  });
}

function render(){
  let rows = DATA.filter(d => activeGu==="전체" || d.gu===activeGu);
  if(sortMode==="deadline") rows.sort((a,b)=> saleDateToNum(a.saleDate)-saleDateToNum(b.saleDate));
  if(sortMode==="discount") rows.sort((a,b)=> pct(b)-pct(a));
  if(sortMode==="priceAsc") rows.sort((a,b)=> a.minBid-b.minBid);
  if(sortMode==="priceDesc") rows.sort((a,b)=> b.minBid-a.minBid);

  document.getElementById('resultCount').textContent = DATA.length + "건";
  document.getElementById('listLabel').textContent =
    (activeGu==="전체" ? "전체 아파트 경매" : activeGu + " 아파트 경매") + ` · ${rows.length}건`;

  updatePinDimming();

  const listEl = document.getElementById('list');
  listEl.innerHTML = "";
  if(rows.length===0){
    listEl.innerHTML = `<div class="empty">해당 지역에 진행 중인 아파트 경매가 없습니다.</div>`;
    return;
  }
  rows.forEach(d=>{
    const t = tier(d);
    const card = document.createElement('div');
    card.className = 'card' + (d.id===selectedId ? ' selected' : '');
    card.id = 'card-'+d.id;
    const badgeText = t==="hot" ? "고할인" : t==="warm" ? "할인" : "저할인";
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-name">${d.name}</div>
          <div class="card-addr">${d.gu} ${d.dong} · ${d.unit}</div>
        </div>
        <div class="badge ${t}">${badgeText} ${pct(d)}%</div>
      </div>
      <div class="price-row">
        <span class="price-now">${won(d.minBid)}</span>
        <span class="price-orig">감정가 ${won(d.appraisal)}</span>
      </div>
      <div class="meta-row">
        <span>사건 <b>${d.caseNo}</b></span>
        <span>면적 <b>${d.area}</b></span>
        <span>유찰 <b>${d.failCount}회</b></span>
        <span>매각기일 <b>2026.${d.saleDate}</b></span>
      </div>
      ${d.tags.length ? `<div class="tags">${d.tags.map(tg=>`<span class="tag">#${tg}</span>`).join('')}</div>` : ''}
    `;
    card.onclick = (ev)=>{ ev.stopPropagation(); selectCard(d.id, true); };
    listEl.appendChild(card);
  });
}

function selectCard(id, showOnMap){
  selectedId = id;
  const d = DATA.find(x=>x.id===id);
  render();
  if(showOnMap && d) showTip(d);
  const elc = document.getElementById('card-'+id);
  if(elc) elc.scrollIntoView({behavior:'smooth', block:'nearest'});
}

loadData();
</script>
</body>
</html>
