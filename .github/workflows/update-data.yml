name: 경매 데이터 자동 업데이트

on:
  schedule:
    # 매일 한국시간 오전 7시 (UTC 22:00 전날)
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # 수동 실행 버튼도 생김 (Actions 탭에서 "Run workflow")

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: 스크래퍼 실행
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python scripts/scrape.py

      - name: 변경사항 커밋
        run: |
          git config user.name "auction-bot"
          git config user.email "auction-bot@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "데이터 자동 업데이트 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
